[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["node_modules", "dist", "release", "third_party_src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = [
  "S101", # assertions are intentional in tests
  "S603", # subprocess arguments are fixed lists and are validated by CommandRunner
  "S607", # SteamOS host utilities are intentionally resolved through PATH
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "(?:node_modules|dist|release|third_party_src)/"

[[tool.mypy.overrides]]
module = "decky"
ignore_missing_imports = true
