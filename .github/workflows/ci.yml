name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  premium-helper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"
          cache: false
      - run: go test -count=1 ./...
        working-directory: backend/premium
      - run: go vet ./...
        working-directory: backend/premium

  backend:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: py_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.21"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff format --check py_modules tests main.py scripts
      - run: python -m ruff check py_modules tests main.py scripts
      - run: python -m mypy py_modules main.py scripts
      - run: python -m unittest discover -s tests -q

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  release-smoke:
    runs-on: ubuntu-24.04
    needs: [backend, frontend, premium-helper]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.21"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: python scripts/elf_audit.py bin/*
      - run: python scripts/fetch_sources.py
      - run: python scripts/build_release.py
      - run: python scripts/verify_release.py ../outputs/V-Deck-v0.2.0.zip
      - run: python scripts/verify_source.py ../outputs/V-Deck-v0.2.0-source.zip
      - name: Stage release artifacts inside the workspace
        run: |
          mkdir -p release
          cp ../outputs/V-Deck-v0.2.0.zip release/
          cp ../outputs/V-Deck-v0.2.0-source.zip release/
      - uses: actions/upload-artifact@v4
        with:
          name: v-deck-release
          path: release/V-Deck-v0.2.0*.zip
          if-no-files-found: error
