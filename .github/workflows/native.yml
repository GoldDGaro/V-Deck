name: Native binaries

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build pinned static x86-64 binaries
        run: docker build --target binaries -f backend/Dockerfile --output type=local,dest=release/native .
      - run: python3 scripts/elf_audit.py release/native/*
      - run: sha256sum release/native/*
      - uses: actions/upload-artifact@v4
        with:
          name: v-deck-native-x86_64
          path: release/native/*
          if-no-files-found: error
