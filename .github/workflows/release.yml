name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.21"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: python3 scripts/elf_audit.py bin/*
      - run: python3 scripts/fetch_sources.py
      - run: python3 scripts/build_release.py
      - run: python3 scripts/verify_release.py ../outputs/V-Deck-v0.1.0.zip
      - run: python3 scripts/verify_source.py ../outputs/V-Deck-v0.1.0-source.zip
      - name: Stage release assets inside the workspace
        run: |
          mkdir -p release
          cp ../outputs/V-Deck-v0.1.0.zip release/
          cp ../outputs/V-Deck-v0.1.0-source.zip release/
          cp ../outputs/SHA256SUMS.txt release/
          cp ../outputs/release-manifest.json release/
      - uses: softprops/action-gh-release@v2
        with:
          name: V-Deck ${{ github.ref_name }} — Public preview / Публичная тестовая версия
          prerelease: true
          files: |
            release/V-Deck-v0.1.0.zip
            release/V-Deck-v0.1.0-source.zip
            release/SHA256SUMS.txt
            release/release-manifest.json
          body_path: .github/RELEASE_NOTES.md
          generate_release_notes: false
